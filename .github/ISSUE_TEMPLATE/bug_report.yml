name: Bug Report
description: Report a bug in Marathon Recompiled
type: "Bug"
body:
  - type: checkboxes
    id: validation
    attributes:
      label: Validation
      options:
        - label: I have checked the [issue tracker](https://github.com/sonicnext-dev/MarathonRecomp/issues) to see if this bug has already been reported
          required: true
        - label: I have confirmed that this bug does not occur in the original game running on original Xbox 360 hardware
          required: true
  - type: checkboxes
    id: dlc
    attributes:
      label: DLC
      description: If you have DLC installed, please specify which ones you have.
      options:
        - label: Additional Episode "Sonic Boss Attack"
        - label: Additional Episode "Shadow Boss Attack"
        - label: Additional Episode "Silver Boss Attack"
        - label: Additional Episode "Team Attack Amigo"
        - label: Additional Mission Pack "Sonic/Very Hard"
        - label: Additional Mission Pack "Shadow/Very Hard"
        - label: Additional Mission Pack "Silver/Very Hard"
  - type: textarea
    id: codes
    attributes:
      label: Codes
      description: Provide a list of your enabled codes here.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide steps to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. etc.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: footage
    attributes:
      label: Footage
      description: Attach a screenshot or video of the bug. If possible, please also provide footage of the expected behaviour on original Xbox 360 hardware.
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Marathon Recompiled are you using? This is located at the bottom right of the installer, or the options menu.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - macOS
        - Linux
      default: 0
    validations:
      required: true
  - type: textarea
    id: specifications
    attributes:
      label: Specifications
      description: Fill out the following details.
      value: |
        - CPU: (e.g. Intel Core [...], AMD FX [...], Qualcomm Snapdragon [...], Apple MX, etc.)
        - GPU: (e.g. NVIDIA GeForce [...], AMD Radeon HD [...], Intel HD [...], etc.)
        - GPU Driver: (e.g NVIDIA Driver 617.XX, AMD Driver 26.X.X, Intel Driver 32.X.X.X, etc.)
        - OS Version: (e.g. Windows 10 22H2, Windows 11 26H2, macOS 15.X.X, Linux distro)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Provide any other context about the problem here.
